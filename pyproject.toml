[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-audit"
version = "0.1.0"
description = "Prüft die Startseite einer Website auf Technik- und Pflichtmängel und schreibt einen Bericht."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joermy" }]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "rich>=13.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
site-audit = "site_audit.cli:main"

[tool.setuptools.packages.find]
include = ["site_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
